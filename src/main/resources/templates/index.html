<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectSync - Project Management Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-600 to-blue-800 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="flex justify-between items-center">
                <h1 class="text-3xl font-bold">ProjectSync</h1>
                <p class="text-blue-100">Project Management Dashboard</p>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Action Bar -->
        <div class="mb-8 flex flex-wrap gap-4 items-end">
            <!-- Search Bar -->
            <div class="flex-1 min-w-[250px]">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Search Projects</label>
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by name or description..."
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                />
            </div>

            <!-- Status Filter -->
            <div class="min-w-[200px]">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Filter by Status</label>
                <select id="statusFilter" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <option value="">All Statuses</option>
                    <option value="PENDING">Pending</option>
                    <option value="IN_PROGRESS">In Progress</option>
                    <option value="COMPLETED">Completed</option>
                </select>
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-2">
                <button
                    id="refreshBtn"
                    class="px-4 py-2 bg-gray-500 hover:bg-gray-600 text-white rounded-lg font-medium transition"
                >
                    Refresh
                </button>
                <button
                    id="createBtn"
                    class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium transition"
                >
                    + New Project
                </button>
            </div>
        </div>

        <!-- Projects Grid -->
        <div id="projectsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Projects will be loaded here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-12">
            <p class="text-gray-500 text-lg">No projects found. Create your first project!</p>
        </div>
    </div>

    <!-- Create/Edit Modal -->
    <div id="projectModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
            <div class="bg-blue-600 text-white px-6 py-4">
                <h2 id="modalTitle" class="text-2xl font-bold">Create New Project</h2>
            </div>

            <form id="projectForm" class="p-6 space-y-4">
                <input type="hidden" id="projectId">

                <!-- Project Name -->
                <div>
                    <label for="projectName" class="block text-sm font-semibold text-gray-700 mb-2">Project Name</label>
                    <input
                        type="text"
                        id="projectName"
                        placeholder="Enter project name"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        required
                    />
                    <span id="nameError" class="text-red-500 text-sm mt-1 hidden"></span>
                </div>

                <!-- Project Description -->
                <div>
                    <label for="projectDescription" class="block text-sm font-semibold text-gray-700 mb-2">Description</label>
                    <textarea
                        id="projectDescription"
                        placeholder="Enter project description"
                        rows="4"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        required
                    ></textarea>
                    <span id="descriptionError" class="text-red-500 text-sm mt-1 hidden"></span>
                </div>

                <!-- Status -->
                <div>
                    <label for="projectStatus" class="block text-sm font-semibold text-gray-700 mb-2">Status</label>
                    <select
                        id="projectStatus"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        required
                    >
                        <option value="">Select a status</option>
                        <option value="PENDING">Pending</option>
                        <option value="IN_PROGRESS">In Progress</option>
                        <option value="COMPLETED">Completed</option>
                    </select>
                    <span id="statusError" class="text-red-500 text-sm mt-1 hidden"></span>
                </div>

                <!-- Team -->
                <div>
                    <label for="projectTeam" class="block text-sm font-semibold text-gray-700 mb-2">Team</label>
                    <input
                        type="text"
                        id="projectTeam"
                        placeholder="Enter team name"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        required
                    />
                    <span id="teamError" class="text-red-500 text-sm mt-1 hidden"></span>
                </div>

                <!-- General Error -->
                <div id="formError" class="text-red-600 text-sm p-3 bg-red-50 rounded-lg hidden"></div>

                <!-- Form Actions -->
                <div class="flex gap-3 pt-4">
                    <button
                        type="submit"
                        class="flex-1 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition"
                    >
                        Save Project
                    </button>
                    <button
                        type="button"
                        id="closeModalBtn"
                        class="flex-1 px-4 py-2 bg-gray-300 hover:bg-gray-400 text-gray-800 rounded-lg font-medium transition"
                    >
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-sm w-full">
            <div class="bg-red-600 text-white px-6 py-4">
                <h2 class="text-xl font-bold">Confirm Delete</h2>
            </div>
            <div class="p-6">
                <p class="text-gray-700 mb-6">Are you sure you want to delete this project? This action cannot be undone.</p>
                <div class="flex gap-3">
                    <button
                        id="confirmDeleteBtn"
                        class="flex-1 px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium transition"
                    >
                        Delete
                    </button>
                    <button
                        id="cancelDeleteBtn"
                        class="flex-1 px-4 py-2 bg-gray-300 hover:bg-gray-400 text-gray-800 rounded-lg font-medium transition"
                    >
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script src="/static/app.js"></script>
</body>
</html>
